services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: rag-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong!Passw0rd
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data-new:/var/opt/mssql

  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: rag-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: rag-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  rag-api:
    image: rag-api
    build:
      context: ./Rag.Api
    container_name: rag-api
    ports:
      - "5000:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=StreamingRagDb;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;
      # Inject the external tunnel URL, fallback to local docker host if empty
      - Ollama__Endpoint=${OLLAMA_ENDPOINT:-http://host.docker.internal:11434/v1/}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      - sqlserver
      - kafka

  rag-producer:
    image: rag-producer
    build:
      context: ./Rag.Producer
    container_name: rag-producer
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      - kafka
      
  frontend:
    image: nginx:alpine
    container_name: rag-frontend
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html

volumes:
  sqlserver-data-new:
